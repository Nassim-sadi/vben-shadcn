# Netlify deployment for @vben/web-shadcn
[build]
  base = ""
  command = "pnpm build"
  publish = "apps/web-shadcn/dist/client"

[build.environment]
  NODE_VERSION = "24.16.0"
  # pnpm is selected automatically from the packageManager field in package.json

# Proxy the API to the .NET backend so the browser only talks to Netlify over
# HTTPS (no mixed-content block) and no CORS is needed (requests are same-origin).
# The backend is HTTP-only on tryasp.net, so Netlify fetches it server-side.
# /api/auth/login  ->  http://mesmanager.tryasp.net/api/auth/login
# NOTE: must be listed before the /* SPA fallback below.
[[redirects]]
  from = "/api/*"
  to = "http://mesmanager.tryasp.net/api/:splat"
  status = 200
  force = true

# SPA fallback: vue-router history mode needs all non-API paths served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
