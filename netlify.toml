# Netlify deployment for @vben/web-shadcn
[build]
  base = ""
  command = "pnpm build"
  publish = "apps/web-shadcn/dist/client"

[build.environment]
  NODE_VERSION = "24.16.0"
  # pnpm is selected automatically from the packageManager field in package.json

# Redirects (API proxy + SPA fallback) live in apps/web-shadcn/public/_redirects,
# which is copied into the publish directory and takes precedence over
# netlify.toml redirects. Keep them there as the single source of truth.
